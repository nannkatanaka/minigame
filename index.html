<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミニゲーム置き場</title>
<style>
:root{--bg:#0f1420;--panel:#182033;--panel2:#202a42;--ink:#e8ecf5;--mute:#8d97ad;--accent:#7dffb0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;padding:32px 16px 48px;display:flex;justify-content:center}
.wrap{width:100%;max-width:880px}
h1{margin:0 0 4px;font-size:clamp(24px,5vw,34px);letter-spacing:.04em}
.lead{color:var(--mute);margin:0 0 28px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
a.game{display:flex;flex-direction:column;background:var(--panel);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;border:2px solid transparent;transition:transform .12s,border-color .12s}
a.game:hover{transform:translateY(-3px);border-color:var(--accent)}
.thumb{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#05080d;font-family:Consolas,"Courier New",monospace;font-weight:bold;font-size:34px;color:var(--accent);text-shadow:0 0 12px #2bff8a88}
.body{padding:12px 14px 16px}
.body h2{margin:0 0 6px;font-size:18px}
.body p{margin:0;color:var(--mute);font-size:13px;line-height:1.6}
.tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:11px;background:var(--panel2);padding:2px 8px;border-radius:8px;color:var(--mute)}
footer{margin-top:40px;color:var(--mute);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>ミニゲーム置き場</h1>
  <p class="lead">ブラウザですぐ遊べる小さなゲームを集めています。</p>

  <div class="grid">
    <!-- ゲームを追加するときは、この <a> ブロックをコピーして書き換える -->
    <a class="game" href="norakura-dakoku/">
      <div class="thumb">18:59:59</div>
      <div class="body">
        <h2>のらりくらり打刻</h2>
        <p>残業代は1時間単位。迫る部長をかわして、19:00:00ジャストにタイムカードを切れ。</p>
        <div class="tags"><span>タイミング</span><span>反射神経</span><span>約1分</span></div>
      </div>
    </a>
    <a class="game" href="harapeko-hole/">
      <div class="thumb" style="background:#cda474">
        <svg viewBox="0 0 160 90" width="78%" aria-hidden="true">
          <g stroke="#a57c4f" stroke-width="1.4" fill="none" opacity=".6"><path d="M0 18 Q40 14 80 19 T160 17"/><path d="M0 72 Q45 68 90 73 T160 71"/></g>
          <circle cx="80" cy="47" r="23" fill="#120e1f" stroke="#7a5532" stroke-width="2"/>
          <ellipse cx="71" cy="42" rx="5" ry="6" fill="#fff"/><circle cx="72.6" cy="43.2" r="2.7" fill="#120e1f"/>
          <ellipse cx="89" cy="42" rx="5" ry="6" fill="#fff"/><circle cx="90.6" cy="43.2" r="2.7" fill="#120e1f"/>
          <circle cx="38" cy="33" r="8" fill="#d99a4e"/><circle cx="35" cy="31" r="1.4" fill="#6b3d1a"/><circle cx="41" cy="35" r="1.4" fill="#6b3d1a"/><circle cx="36.5" cy="37" r="1.1" fill="#6b3d1a"/>
          <circle cx="124" cy="62" r="9" fill="#c9893a" stroke="#a96e28" stroke-width="2"/>
          <circle cx="112" cy="25" r="2" fill="#8f8a96"/><circle cx="118" cy="30" r="1.4" fill="#8f8a96"/><circle cx="55" cy="70" r="1.8" fill="#8f8a96"/>
        </svg>
      </div>
      <div class="body">
        <h2>ハラペコホール</h2>
        <p>なんでも飲みこむ穴になって、机のカスから宇宙まで育て。目標を飲みこみながら、さいごは宇宙をまるごと。</p>
        <div class="tags"><span>成長</span><span>ドラッグ操作</span><span>約5分</span></div>
      </div>
    </a>
  </div>

  <footer>© ミニゲーム置き場</footer>
</div>
</body>
</html>
